# drop-in 片段，由 deploy/nginx-apply.sh 安装到
#   /etc/nginx/snippets/servers/monitor.conf
# 站点配置（站点仓库的 deploy/nginx-site.conf）里有一行泛化包含
#   include /etc/nginx/snippets/servers/*.conf;
# 于是本文件被自动收进去，站点仓库那边不需要为 monitor 改任何东西。
#
# 为什么单独成一个文件、而不是往站点文件里插 location：站点仓库的 deploy.sh
# 每次发布都会用自己的模板整体覆盖 /etc/nginx/sites-available/default。写进站点文件
# 的改动会被抹掉；反过来要求 monitor 的部署去改另一个仓库受版本控制的文件，则是把
# 两个仓库耦合在一起，谁忘了跑一次就互相冲掉。
#
# 为什么必须写成 ^~：站点里已经有一条静态兜底
#   location ~* \.(js|css|json|map|txt|...)$ { try_files $uri =404; }
# nginx 的匹配顺序是 精确= → 最长前缀 →（没被 ^~ 截断时）正则 → 前缀。
# 用普通前缀 /monitor/ 的话，/monitor/app.js 会先命中那条正则，被拿去站点仓库
# 的 root 下找，结果 404，面板只剩一张白屏。
#
# proxy_pass 末尾的 / 也不能省：带 URI 才会剥掉 /monitor 前缀
# （/monitor/api/current -> /api/current）；不写的话前缀原样透传，全部 404。

location = /monitor {
    return 301 /monitor/;
}

location ^~ /monitor/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
}
